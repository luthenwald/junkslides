name = "junkslides_client"
version = "0.1.0"
target = "javascript"
description = "The junkslides editor in the browser: cells pane and slide pane."

[dependencies]
junkslides_core = { path = "../core" }
junkslides_render = { path = "../render" }
gleam_stdlib = ">= 1.0.0 and < 2.0.0"
gleam_json = ">= 3.1.0 and < 4.0.0"
gleam_javascript = ">= 1.0.0 and < 2.0.0"
gleam_time = ">= 1.0.0 and < 2.0.0"
lustre = ">= 5.7.1 and < 6.0.0"
lustre_websocket = ">= 1.1.0 and < 2.0.0"
plinth = ">= 0.11.0 and < 1.0.0"

[dev_dependencies]
gleeunit = ">= 1.0.0 and < 2.0.0"
lustre_dev_tools = ">= 2.4.0 and < 3.0.0"
# Held below 4.4.0: that release deprecates http.Header, which mist 6.0.3 and
# gramps 6.0.1 (through lustre_dev_tools) still use, so every clean build warns. Lift once they have moved on.
gleam_http = ">= 4.3.0 and < 4.4.0"
