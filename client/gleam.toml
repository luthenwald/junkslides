name = "zeno_client"
version = "0.1.0"
target = "javascript"
description = "The Zeno editor in the browser: cells pane and slide pane."

[dependencies]
zeno_core = { path = "../core" }
gleam_stdlib = ">= 1.0.0 and < 2.0.0"
gleam_json = ">= 3.1.0 and < 4.0.0"
gleam_javascript = ">= 1.0.0 and < 2.0.0"
lustre = ">= 5.7.1 and < 6.0.0"
lustre_websocket = ">= 1.1.0 and < 2.0.0"
jot = ">= 12.1.2 and < 13.0.0"

[dev_dependencies]
gleeunit = ">= 1.0.0 and < 2.0.0"
lustre_dev_tools = ">= 2.4.0 and < 3.0.0"
