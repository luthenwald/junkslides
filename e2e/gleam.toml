name = "zeno_e2e"
version = "0.1.0"
target = "erlang"
description = "The editor in headless Chrome against a real server, driven over the DevTools protocol."

[dependencies]
zeno_core = { path = "../core" }
zeno_server = { path = "../server" }
gleam_stdlib = ">= 1.0.0 and < 2.0.0"
gleam_erlang = ">= 1.3.0 and < 2.0.0"
gleam_http = ">= 4.0.0 and < 5.0.0"
gleam_httpc = ">= 5.0.0 and < 6.0.0"
gleam_otp = ">= 1.3.0 and < 2.0.0"
gleam_json = ">= 3.1.0 and < 4.0.0"
stratus = ">= 3.0.0 and < 4.0.0"
simplifile = ">= 2.7.0 and < 3.0.0"
filepath = ">= 1.1.2 and < 2.0.0"

[dev_dependencies]
gleeunit = ">= 1.0.0 and < 2.0.0"
