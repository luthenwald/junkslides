<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>Cells settling into place</title>
<style>
   /* Two cells leave the flowing column for boxes of their own, the column
      closes up behind them, and both go back. CSS only, looping. */
   html, body { margin: 0; height: 100%; background: #fcfcfa; }
   svg { display: block; width: 100%; height: 100%; }

   .slide { fill: #fcfcfa; stroke: #cfcfcf; stroke-width: 2; }
   .dot { fill: #e2e2df; }
   .body { fill: none; stroke: #d9d9d6; stroke-width: 1.5; stroke-dasharray: 6 6; }
   .cell { fill: #d9d9d6; }
   .cell.moves { fill: #d4502c; }

   .cell { animation: 12s ease-in-out infinite; }
   .b { animation-name: b; }
   .c { animation-name: c; }
   .d { animation-name: d; }
   .e { animation-name: e; }

   /* Slots in the column are 90 apart, from y = 80. */
   @keyframes b {
      0%, 10% { x: 260px; y: 170px; width: 440px; height: 70px; }
      25%, 65% { x: 860px; y: 80px; width: 330px; height: 180px; }
      80%, 100% { x: 260px; y: 170px; width: 440px; height: 70px; }
   }
   @keyframes c {
      0%, 18% { y: 260px; }
      25%, 65% { y: 170px; }
      80%, 100% { y: 260px; }
   }
   @keyframes d {
      0%, 18% { x: 260px; y: 350px; width: 440px; height: 70px; }
      25%, 35% { x: 260px; y: 260px; width: 440px; height: 70px; }
      50%, 65% { x: 860px; y: 320px; width: 330px; height: 220px; }
      80%, 100% { x: 260px; y: 350px; width: 440px; height: 70px; }
   }
   @keyframes e {
      0%, 18% { y: 440px; }
      25%, 42% { y: 350px; }
      50%, 65% { y: 260px; }
      80%, 100% { y: 440px; }
   }

   @media (prefers-reduced-motion: reduce) {
      .cell { animation: none; }
   }
</style>
</head>
<body>
<svg viewBox="0 0 1440 620" preserveAspectRatio="xMidYMid meet" aria-hidden="true">
   <defs>
      <pattern id="dots" width="30" height="30" patternUnits="userSpaceOnUse" x="200" y="20">
         <circle class="dot" cx="0" cy="0" r="1.6"/>
      </pattern>
   </defs>
   <rect class="slide" x="200" y="20" width="1040" height="585" rx="4"/>
   <rect x="200" y="20" width="1040" height="585" fill="url(#dots)"/>
   <rect class="body" x="240" y="60" width="480" height="485" rx="4"/>

   <rect class="cell a" x="260" y="80" width="440" height="70" rx="6"/>
   <rect class="cell c" x="260" y="260" width="440" height="70" rx="6"/>
   <rect class="cell e" x="260" y="440" width="440" height="70" rx="6"/>
   <!-- The cells that move come last, so they pass over the others. -->
   <rect class="cell moves b" x="260" y="170" width="440" height="70" rx="6"/>
   <rect class="cell moves d" x="260" y="350" width="440" height="70" rx="6"/>
</svg>
</body>
</html>
