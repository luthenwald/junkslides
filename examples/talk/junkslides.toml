# Settings for this deck. theme.css comes after them and can change anything.

# Fonts your system has. To use font files of your own, put them in the
# deck's fonts/ folder and name them here:
#
#   [font.text]
#   family = "My Serif"
#   regular = "fonts/my-serif-regular.woff2"
#   italic = "fonts/my-serif-italic.woff2"
#   bold = "fonts/my-serif-bold.woff2"

[font.text]
family = "Charter"
fallback = 'Palatino, "Palatino Linotype", Georgia, serif'

[font.code]
family = "Menlo"
fallback = "ui-monospace, Consolas, monospace"

[palette]
background = "#fafafa"
text = "#222"
quiet = "#777"   # slide numbers and the quiet variant
accent = "#222"  # for themes, as var(--js-accent)

[type]
size = 32        # pixels on a 1920 by 1080 slide
line-height = 1.4
code-scale = 1   # code size against its text, such as 0.875

[slide]
numbers = "01/12"  # or "01 / 12", "01", or "none"
margin = 2         # body inset in 60 px grid units, or [rows, columns]
gap = 24           # pixels between cells that flow
