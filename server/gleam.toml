name = "junkslides_server"
version = "0.2.0"
target = "erlang"

[dependencies]
junkslides_core = { path = "../core" }
junkslides_render = { path = "../render" }
gleam_stdlib = ">= 1.0.0 and < 2.0.0"
gleam_erlang = ">= 1.3.0 and < 2.0.0"
gleam_otp = ">= 1.3.0 and < 2.0.0"
# Held below 4.4.0: that release deprecates http.Header, which mist 6.0.3 and
# gramps 6.0.1 still use, so every clean build warns. Lift once they have moved on.
gleam_http = ">= 4.3.0 and < 4.4.0"
gleam_json = ">= 3.1.0 and < 4.0.0"
gleam_crypto = ">= 1.6.0 and < 2.0.0"
gleam_time = ">= 1.11.0 and < 2.0.0"
mist = ">= 6.0.3 and < 7.0.0"
simplifile = ">= 2.7.0 and < 3.0.0"
filepath = ">= 1.1.2 and < 2.0.0"
argv = ">= 1.0.2 and < 2.0.0"
envoy = ">= 1.0.2 and < 2.0.0"
logging = ">= 1.5.0 and < 2.0.0"
shellout = ">= 1.8.0 and < 2.0.0"
tom = ">= 2.1.0 and < 3.0.0"

[dev_dependencies]
gleeunit = ">= 1.11.0 and < 2.0.0"
stratus = ">= 3.0.0 and < 4.0.0"
gleam_httpc = ">= 5.0.0 and < 6.0.0"
